name: Release Dry Run

# Everything release.yml does except touching a release: the same tag check (on a branch, so
# "is on main" is skipped), the same gate, the same builds, and the same collection of the five
# release files. A version that would fail in the release fails here first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version — use v1.0.0-rc.1 (or -pre.1, -alpha.1) for a pre-release dry run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the version form and that it is newer than the latest release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # The sources release is the dry run's one difference: a rehearsal is exactly the run of a
        # version whose sources have not been mirrored yet. The tag itself is never that forgiving.
        run: |
          python3 tools/release/release_tag.py check "$VERSION" --repo "$REPO" --skip-main \
            --skip-sources

  lint:
    needs: [validate]
    uses: ./.github/workflows/format_lint.yml

  test:
    needs: [validate]
    uses: ./.github/workflows/tests.yml

  # Both build jobs run read-only and upload their outputs as artifacts, exactly as in the
  # release. Their names are the release's own with another prefix, so the check below lists
  # the same artifacts `publish` does.
  build-wheel:
    needs: [lint, test]
    uses: ./.github/workflows/build_wheel.yml
    with:
      version: ${{ inputs.version }}
      artifact_name: dry-run-wheel

  build-standalone:
    needs: [lint, test]
    uses: ./.github/workflows/build_artifacts.yml
    with:
      version: ${{ inputs.version }}
      artifact_prefix: dry-run

  # What `publish` does before it uploads: exactly one file of each kind and nothing else, so a
  # renamed installer or a stray file fails here, not on release day. No release is touched.
  check-release-files:
    name: Check the release files
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # `gh run download` lists this run's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --dir artifacts \
            -n dry-run-wheel -n dry-run-linux -n dry-run-windows -n dry-run-macos

      - name: Collect the release files
        run: python3 tools/release/release_tag.py collect artifacts release
