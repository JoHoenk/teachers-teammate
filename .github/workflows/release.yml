name: Release

# A release is a tag: the tag is the version and the commit it points at is what is built.
#   git tag v0.5.7 && git push origin v0.5.7
# The workflow leaves a complete draft release; the maintainer reviews it and publishes it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag. A shared group would keep only one pending run and cancel the others, so
# three tags pushed together would lose the middle one. Different tags build side by side;
# the version check in `validate` keeps a tag from shipping below the latest release, and
# nothing marks a release "Latest" on its own — the maintainer does that when publishing.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Validate the tag before anything is built ─────────────────────────────
  # Fails in seconds, before a build starts or a draft exists. A bad tag is deleted by hand
  # (`git push --delete origin <tag>`) and pushed again.
  validate:
    name: Validate the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the tagged commit can be checked against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag form and that the tag is on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # vX.Y.Z or vX.Y.Z-(alpha|beta|rc|pre)[.]N, the number required. A PEP 440 form
          # without the dash (v0.5.7rc1) is rejected: GitHub would publish it as Latest and
          # VIProductVersion would break makensis.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|pre)\.?[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Use vX.Y.Z or vX.Y.Z-(alpha|beta|rc|pre)[.]N."
            echo "Delete it with: git push --delete origin '$TAG'"
            exit 1
          fi
          python3 tools/release/stamp_versions.py --version "$TAG" --check
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::'$TAG' does not point at a commit on main, so it cannot ship."
            echo "Delete it with: git push --delete origin '$TAG'"
            exit 1
          fi
          # The app's update check reads /releases/latest, so a version that is not newer than
          # it would either replace it as "Latest" or ship a build nobody is offered.
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ -n "$latest" && "$latest" != "$TAG" ]]; then
            base="${TAG%%-*}"
            highest=$(printf '%s\n%s\n' "$latest" "$base" | sort -V | tail -n1)
            # A pre-release of the latest version itself is stale too, so the base must be
            # strictly higher; a final tag may only equal it on a re-run (handled above).
            if [[ "$highest" != "$base" || "$base" == "$latest" ]]; then
              echo "::error::'$TAG' is not newer than the latest release '$latest'."
              echo "Delete it with: git push --delete origin '$TAG'"
              exit 1
            fi
          fi

  # ── Quality gate ─────────────────────────────────────────────────────────
  # The merge queue keeps `main` green, but a tag can be pushed at any time and the release
  # publishes artifacts publicly, so lint + tests run again as a hard gate.
  lint:
    needs: [validate]
    uses: ./.github/workflows/format_lint.yml

  test:
    needs: [validate]
    uses: ./.github/workflows/tests.yml

  # ── Create the draft release ──────────────────────────────────────────────
  # The only job besides `publish` that may write: it creates the empty draft the assets
  # are attached to. No build job holds a write token (see the reusable workflows).
  create-release:
    name: Create the draft release
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A draft, so a half-uploaded release is never visible and the update check
          # (`/releases/latest`) never offers it. The tag exists already, so `--verify-tag`
          # is the check and no target commit is needed.
          #
          # The body starts with the link to the code signing policy: the signing service asks
          # for it on every download page. GitHub puts `--notes` in front of the generated
          # notes, so both are kept.
          notes="**What is signed, where the files come from and what the app does with your data:** [code signing policy](https://github.com/${REPO}/blob/main/docs/code_signing_policy.md)"
          args=(--draft --verify-tag --generate-notes --notes "$notes" --title "Release $TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$REPO" "${args[@]}"

  # ── Wheel (pure-Python, platform-independent) ───────────────────────────
  # Read-only: it uploads the wheel as an artifact, and `publish` attaches it.
  build-wheel:
    needs: [create-release]
    uses: ./.github/workflows/build_wheel.yml
    with:
      version: ${{ github.ref_name }}
      retention_days: 3
      # Named apart from the manual "Build bundles" artifacts, whose prune step deletes
      # `teachers-teammate-*` from every other run — it must never reach a release's files.
      artifact_name: release-wheel

  # ── Standalone executables + platform installers ─────────────────────────
  # Read-only, for the same reason.
  build-standalone:
    needs: [create-release]
    uses: ./.github/workflows/build_artifacts.yml
    with:
      version: ${{ github.ref_name }}
      retention_days: 3
      # Same reason: `release-linux`, `release-windows`, `release-macos` (+ `-smoke`).
      artifact_prefix: release

  # ── Attach the assets to the draft ────────────────────────────────────────
  # The one job that writes to the release, and it only uploads files: it never flips the
  # draft to published. The maintainer reviews the notes and the assets in the release form
  # and clicks *Publish* (DC12) — a failed build therefore never leaves a public release
  # without installers, and immutable releases stay possible.
  publish:
    name: Attach the assets to the draft
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # `gh run download` lists this run's artifacts.
      actions: read
      # For the provenance attestation: the OIDC token proves which workflow built the files.
      id-token: write
      attestations: write
    steps:
      # Only the artifacts that carry release files, by name: nothing else of this run (smoke
      # reports, anything a build step added under another name) can reach the release.
      - name: Download the build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$REPO" --dir artifacts \
            -n release-wheel -n release-linux -n release-windows -n release-macos

      # Exactly one file of each kind, or the run fails: a draft with a missing installer
      # (or a stray extra file) must never be offered for publishing.
      - name: Collect the release files
        run: |
          mkdir -p release
          fail=0
          for pattern in '*.whl' '*.deb' '*-linux-x86_64.tar.gz' '*-w64-setup.exe' '*-macos.dmg'; do
            mapfile -t found < <(find artifacts -type f -name "$pattern")
            if [[ ${#found[@]} -ne 1 ]]; then
              echo "::error::expected exactly one '$pattern', found ${#found[@]}"
              fail=1
              continue
            fi
            cp -v "${found[0]}" release/
          done
          # Nothing besides those five files may be in the artifacts.
          extra=$(find artifacts -type f | wc -l)
          if [[ "$extra" -ne 5 ]]; then
            echo "::error::the artifacts hold $extra files, expected exactly 5"
            find artifacts -type f
            fail=1
          fi
          exit "$fail"

      - name: Write SHA256SUMS
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - name: Upload the assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" release/* --repo "$REPO" --clobber

      - name: Summarise the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Draft release \`$TAG\`"
            echo
            echo "Nothing is public yet. Check the notes and the assets, then click **Publish**:"
            echo "https://github.com/$REPO/releases/edit/$TAG"
            echo
            if [[ "$TAG" == *-* ]]; then
              echo "The draft is already marked pre-release."
            else
              # GitHub would pick "Latest" by creation date, so an older tag that finishes
              # last could take it from a higher version: say which way to tick.
              latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
              highest=$(printf '%s\n%s\n' "${latest:-v0}" "$TAG" | sort -V | tail -n1)
              if [[ "$highest" == "$TAG" ]]; then
                echo "Tick **Set as the latest release** when you publish."
              else
                echo "**Do not** tick *Set as the latest release*: \`$latest\` is newer than \`$TAG\`."
              fi
            fi
            echo
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in release/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
