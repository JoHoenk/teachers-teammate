name: Build environment
description: >-
  The venv the bundle build, the tests and the weekly add-on check share: one recipe,
  tools/build/make_venv.py, so they cannot drift.

# The caller checks out first and runs actions/setup-python with python-version-file:
# .python-version. The venv's script folder goes on the PATH, so later steps find its python.

inputs:
  for:
    description: >-
      What to install on top of the pinned constraints: the bundle's base runtime (build, the
      default), the `[test]` extra (test), or every extra (dev).
    required: false
    default: build

runs:
  using: composite
  steps:
    - name: Create the build environment
      shell: bash
      env:
        PURPOSE: ${{ inputs.for }}
      run: |
        # The recipe and its reasons live in the script: a fresh venv, the pinned install, and
        # no optional extras unless asked for.
        folder="$(python tools/build/make_venv.py "$RUNNER_TEMP/build-venv" --for "$PURPOSE" | tail -n 1)"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cygpath -w "$folder" >> "$GITHUB_PATH"
        else
          echo "$folder" >> "$GITHUB_PATH"
        fi
