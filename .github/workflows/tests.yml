name: Reusable Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: tests
          repository-cache: true

      - name: Allow unprivileged user namespaces (Bazel linux-sandbox)
        # Ubuntu 24.04 runners block them via AppArmor, which makes Bazel fall
        # back to the weaker processwrapper-sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libglib2.0-0

      - name: Run unit tests
        # LangChain is an optional runtime dependency (pip install "teachers-teammate[llm]").
        # The test lock file (requirements_test_lock.txt) includes langchain-core so that
        # correction, evaluation, and LLM OCR tests are exercised in CI.
        run: bazel test --config=ci //tests/... --test_output=errors
        env:
          QT_QPA_PLATFORM: offscreen
