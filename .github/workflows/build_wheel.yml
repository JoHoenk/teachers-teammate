name: Reusable Build Wheel

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3 or 1.2.3)"
        required: true
        type: string
      artifact_name:
        description: "Uploaded artifact name"
        required: false
        type: string
        default: "wheel"
      retention_days:
        description: "Retention days for uploaded artifacts"
        required: false
        type: number
        default: 14

# Read-only, and declared here rather than left to the caller: the wheel is built by Bazel
# from the same third-party code the bundles use, so it must not be able to write to a
# release. release.yml's `publish` job attaches the wheel. A caller cannot raise this.
permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # The token stays out of .git/config: nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: wheel
          repository-cache: true

      - name: Stamp pyproject and Bazel wheel version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python tools/release/stamp_versions.py --version "$VERSION"

      - name: Build wheel with Bazel
        run: |
          bazel build --config=ci //teachers_teammate:teachers_teammate_wheel
          mkdir -p dist
          cp bazel-bin/teachers_teammate/*.whl dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          retention-days: ${{ inputs.retention_days }}
          path: dist/*.whl
