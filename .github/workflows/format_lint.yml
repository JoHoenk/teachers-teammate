name: Reusable Format and Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        with:
          disk-cache: lint

      - name: Check formatting
        run: bazel run --config=ci //:format.check

      - name: Run the linters (Python, shell)
        run: bazel test --config=ci //:lint --test_output=errors

  # The workflow files. rules_lint has no linter for them (the Python and the shell scripts are
  # in //:lint above); a broken `run:` block or an unpinned action would first show on release day.
  lint-ci:
    name: Lint the workflows
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Install actionlint and zizmor
        run: python -m pip install -r tools/ci/requirements.txt

      - name: Check the workflows (actionlint)
        run: actionlint

      - name: Check the workflows for security problems (zizmor)
        run: zizmor --no-progress --offline .
