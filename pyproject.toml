# pyproject.toml — project metadata, build system, linting & formatting

[project]
name = "teachers-teammate"
dynamic = ["version"]
description = "OCR pipeline for handwritten documents"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # Only the Essentials half of PySide6. The `PySide6` meta package would also pull
    # PySide6_Addons, PySide6_Pdf and PySide6_WebEngine (Chromium) since 6.12 — none is used.
    "PySide6-Essentials>=6.7",
    "qdarkstyle>=3.2",
    "psutil>=5.9",
    "requests>=2.32",
    # headless: the app never calls cv2.imshow, and the GUI build bundles a second Qt (Qt5).
    "opencv-python-headless>=5.0",
    "pypdfium2>=4.0",
    "numpy>=1.26",
    "python-docx>=1.1,<2",
    "lxml>=4.9",
    "markdown-it-py>=3",
    "Pillow>=10",
    "platformdirs>=4.0",
    "ollama>=0.4",
    "pydantic>=2",
    # The built-in reader reads its recogniser's character list from the model's inference.yml.
    "PyYAML>=6",
    # Character alignment of a page's lines against the text that was read from it, once per
    # document: the one step where the two texts are not both clean.
    "rapidfuzz>=3.9",
    # API keys of the online AI services: the system keychain (macOS Keychain, Windows
    # Credential Manager, Linux Secret Service); without one the keys stay in the settings file.
    "keyring>=24",
    # The System Monitor's GPU and VRAM gauges (module ``pynvml``). 60 KB, pure Python, BSD:
    # bundled rather than downloaded, so nothing asks for a package at start-up.  Without an
    # NVIDIA driver it imports and reports nothing; AMD needs no package at all (sysfs).
    "nvidia-ml-py>=12",
]

[project.optional-dependencies]
llm = [
    "langchain-core>=1.4.7",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-google-genai>=2.0",
    "langchain-mistralai>=1.1",
    "langchain-cohere>=0.1",
]
privacy = [
    "spacy>=3.7",
]

# ── Tooling extras ──────────────────────────────────────────────────────────
# These are the single source of truth for the lint and test toolchains. The Bazel
# lock files are compiled from them via `bazel run //:requirements{,_dev,_addons}.update`
# (see //BUILD). Installing the extra also pulls the base runtime deps, so a
# `pip install -e ".[test]"` env can run the full suite.
test = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-qt>=4.4",
    # Optional runtime deps the unit/correction tests exercise directly.
    "langchain-core>=1.4.7",
]
dev = [
    # Test tooling. The [test] extra above is not included here, so this lock carries the rest of
    # what a dev run imports: pytest-qt and langchain-core come with [test].
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    # Sphinx documentation
    "sphinx>=8.0",
    "furo>=2024.8",
    "myst-parser>=4.0",
    "sphinxcontrib-plantuml>=0.30",
]

[project.scripts]
teachers-teammate = "teachers_teammate.cli:main"
teachers-teammate-gui = "teachers_teammate.gui:main_gui"

[build-system]
# `wheel` is not needed: setuptools builds wheels itself since 70.1.  `license` as an SPDX
# expression and `license-files` need 77 (PEP 639).
#
# The help pages live in `docs/`, outside the package, so a wheel built here has none; the wheel
# the release ships is Bazel's (//teachers_teammate:teachers_teammate_release_wheel), which copies them in
# as `teachers_teammate/_docs/`.  An editable install finds them where they are.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teachers_teammate*"]

# What the app shows besides its code.  The list is the one in `wheel_data` of
# teachers_teammate/BUILD; a glob would also take the `.ico` and `.icns` a build machine generates.
[tool.setuptools.package-data]
teachers_teammate = [
    "assets/LICENSE.txt",
    "assets/teachers_teammate.png",
    "assets/teachers_teammate_icon.png",
    "assets/third_party_inventory.csv",
    "assets/third_party_licenses.txt",
]

[tool.setuptools.dynamic]
version = { attr = "teachers_teammate.__version__" }

# ── Tool configuration ─────────────────────────────────────────────────────
#
# Tools configured here:
#   ruff   — linter and formatter (replaces flake8, isort, black, pylint)
#   ty     — Rust-based type checker (replaces mypy)
#
# Compatible with aspect-build/rules_lint which honours these standard config
# files when running linters under Bazel.
# See: https://github.com/aspect-build/rules_lint

# ── ruff ──────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py314"
# The memory agent is copied alone to other machines, which may run Python 3.9, so ruff flags
# newer syntax in that one file.
per-file-target-version = { "tools/evaluation/run/gpu_agent.py" = "py39" }

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort import ordering
    "UP",   # pyupgrade — modernise syntax
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions — cleaner comprehensions
    "BLE",  # flake8-blind-except — avoid bare except
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "SLF",  # flake8-self — flag private-member access (noqa where needed)
    "ARG",  # flake8-unused-arguments — catch unused params in production code
    "PLC",  # pylint convention
    "PLR",  # pylint refactor
    "PLW",  # pylint warning
]
ignore = [
    "E501",    # line-length: enforced by the formatter instead
    "PLR2004", # magic-value-comparison: sensor thresholds, UI sizes, and Qt flags in this codebase are self-documenting
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F401",    # Tests frequently import symbols in local scenarios and monkeypatch chains.
    "F811",    # A fixture imported from a harness module is redefined by the test argument that asks for it.
    "I001",    # Local import placement in Given/When/Then tests is intentional.
    "ARG",     # pytest fixtures are declared as args and injected by name; unused declarations are intentional.
    "PLW0108", # Lambda callbacks keep signal assertions compact in GUI tests.
    "PT018",   # Some assertions intentionally bundle state+truthiness checks.
    "RUF059",  # Unused unpacked values are acceptable in negative-path checks.
    "SLF001",  # Tests intentionally touch private members to validate behavior.
]
"tools/user_text/allowlist.py" = [
    "RUF001",  # The entries reproduce a source sentence verbatim, its dashes and quotes included.
]

[tool.ruff.lint.pylint]
# The design limits of a function: branches, returns, arguments.
max-branches = 15
max-returns = 9
max-args = 8

[tool.ruff.lint.isort]
# `tools/` is a namespace directory, so ruff would classify it as third-party from
# src detection alone — and the lint sandbox for a `//tools:*` target holds neither
# directory, which made the classification differ between targets. Listing both keeps
# it stable.
known-first-party = ["teachers_teammate", "tools"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# ── ty ────────────────────────────────────────────────────────────────────
# Astral's Rust-based type checker.
# https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# The runtime packages ARE resolved under Bazel (see //teachers_teammate:*_typed). Two kinds of
# module ty cannot see stay allowed: the optional extras, which are in no lock because they are
# installed on request into the app's own folder, and lxml's C extension, which ships no type
# information. Everything else it must resolve.
allowed-unresolved-imports = [
    "anthropic",
    "cohere",
    "google.genai",
    "langchain_anthropic",
    "langchain_cohere",
    "langchain_google_genai",
    "langchain_mistralai",
    "langchain_ollama",
    "langchain_openai",
    "lxml.etree",
    "mistralai",
    "openai",
    "pynvml",
]

[tool.ty.rules]
# PySide6 stubs use positional 'a0'/'a1' parameter names that differ from our
# descriptive names; suppress the Liskov-violation noise project-wide.
invalid-method-override = "ignore"

# Tests legitimately reach into Optional widget accessors (`table.item(r, c)`,
# `dlg.tabWidget()`) without None-guards — the same latitude the ruff SLF001
# per-file-ignore grants. Scope this to the test tree only.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# ── pytest ────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "needs_reader_models: runs the built-in reader's real model files (Bazel fetches them)",
    "needs_ollama: requires a running Ollama instance",
    "needs_bazel: reads the Bazel runfiles, so it runs under `bazel test` and is skipped elsewhere",
    "gui: exercises PySide6 widgets/event loop",
    "platform: covers code that differs per operating system; runs on all three",
    "use_case: links test to a named use case from use_cases.trlc",
]
