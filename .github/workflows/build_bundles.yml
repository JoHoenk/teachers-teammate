name: Build bundles

# Manual, private test build: produces the three platform bundles as workflow-run
# artifacts (no GitHub Release, no tag). Download one with:
#   gh run download <run-id> -n teachers-teammate-linux
#
# Only the newest manual build is kept: once a build succeeds, artifacts from earlier manual
# runs are deleted (a failed build leaves the previous one in place). Pull-request builds
# carry their own artifact prefix and are left alone.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the bundles (a release form, e.g. v0.0.0-rc.1)"
        required: true
        type: string
        default: "v0.0.0-rc.1"
  # The installer scripts and the bundle spec are only exercised on their own system, and the app
  # walkthrough runs on the bundles: a change to any of them, or to the app or the walkthrough,
  # builds and tests the bundles here rather than after the release.
  pull_request:
    paths:
      - "teachers_teammate/**"
      - "tests/e2e/**"
      - "tools/packaging/**"
      - "tools/build/**"
      - "requirements*.txt"
      - "MODULE.bazel*"
      - ".python-version"
      - ".github/workflows/build_*.yml"

# A new push to the same pull request cancels the run it supersedes; a dispatch is never
# cancelled, so two dispatches cannot delete each other's artifacts.
concurrency:
  group: build_bundles-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTIFACT_PREFIX: teachers-teammate

jobs:
  build-bundles:
    # Read access is enough (nothing is published), so a pull request from a fork, whose
    # token cannot be raised, builds like any other.
    permissions:
      contents: read
    uses: ./.github/workflows/build_artifacts.yml
    with:
      # A pull request has no input: it builds the version a dispatch offers by default, so the
      # test version is written down once. Older than anything published, which the installer
      # tests rely on (they allow the downgrade).
      version: ${{ inputs.version || 'v0.0.0-rc.1' }}
      retention_days: 2
      # A pull request's bundles are named apart, so the prune step below never deletes
      # artifacts a reviewer may still want to download.
      artifact_prefix: ${{ github.event_name == 'pull_request' && 'teachers-teammate-pr' || 'teachers-teammate' }}

  prune-old-artifacts:
    name: Delete previous bundle artifacts
    needs: [build-bundles]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # By pattern, not by a list of names: the install jobs upload one smoke result per image
      # (`...-linux-installed-smoke-ubuntu-24.04`), and a new job must not need an edit here. A
      # pull request's artifacts start with `teachers-teammate-pr-`, which the pattern skips.
      - name: Delete artifacts from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          pattern="^${ARTIFACT_PREFIX}-(linux|windows|macos)(-|$)"
          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${RUN_ID}) | select(.name | test(\"${pattern}\")) | \"\(.id) \(.name)\"" |
          while read -r id name; do
            echo "Deleting artifact ${id} (${name})"
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"
          done
