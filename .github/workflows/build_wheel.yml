name: Reusable Build Wheel

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3 or 1.2.3)"
        required: true
        type: string
      artifact_name:
        description: "Uploaded artifact name"
        required: false
        type: string
        default: "wheel"
      retention_days:
        description: "Retention days for uploaded artifacts"
        required: false
        type: number
        default: 14

# Read-only, and declared here rather than left to the caller: the wheel is built by Bazel
# from the same third-party code the bundles use, so it must not be able to write to a
# release. release.yml's `publish` job attaches the wheel. A caller cannot raise this.
permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The token stays out of .git/config: nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        with:
          disk-cache: wheel

      - name: Stamp the version into the package
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python tools/release/stamp_versions.py --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

      # Bazel substitutes the embed label into the wheel's version and file name, so the tag and
      # the installed metadata cannot disagree. `.dist` is the folder holding the stamped name.
      - name: Build wheel with Bazel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bazel build --config=ci --stamp --embed_label="$VERSION" \
            //teachers_teammate:teachers_teammate_release_wheel.dist
          mkdir -p dist
          cp bazel-bin/teachers_teammate/teachers_teammate_release_wheel_dist/*.whl dist/

      # What a teacher does: `pip install` the file into a clean environment with the versions
      # the app is tested with (the constraints are the test lock), and start what it installed.
      # //tests:test_wheel holds the wheel to the sources and pyproject.toml; this holds the
      # installed result to "it starts". From $RUNNER_TEMP, because the repository root would
      # shadow the installed package with the source tree (python -I does too, belt and braces).
      - name: Install the wheel into a clean environment and start it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0
          python tools/build/make_constraints.py
          constraints="$PWD/pyinstaller-work/constraints.txt"
          wheel=$(find "$PWD/dist" -name "*.whl")
          repo="$PWD"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          cd "$RUNNER_TEMP"
          wheel-venv/bin/python -m pip install --quiet --only-binary :all: -c "$constraints" "$wheel"
          wheel-venv/bin/teachers-teammate --help > /dev/null
          wheel-venv/bin/python -I "$repo/tools/release/check_installed_wheel.py"
          # The extras resolve against the same versions (nothing is installed: spaCy and the
          # LangChain providers are large, and the weekly add-on resolution covers their install).
          wheel-venv/bin/python -m pip install --quiet --dry-run --only-binary :all: \
            -c "$constraints" "${wheel}[llm,privacy]"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name }}
          retention-days: ${{ inputs.retention_days }}
          path: dist/*.whl

  # The other wheel a source install builds: setuptools reads pyproject.toml, so its package data
  # has to carry the assets listed there.  Its own job, because the build fetches an unpinned
  # setuptools: nothing it runs can reach the wheel the release ships.  The help pages are not in
  # it (see the comment at [build-system] in pyproject.toml), so they are not checked here.
  setuptools-wheel:
    name: Build the setuptools wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      - name: Build the wheel and check its assets
        run: |
          python -m pip wheel --quiet --no-deps -w "$RUNNER_TEMP/setuptools-dist" .
          python - "$RUNNER_TEMP/setuptools-dist" <<'PY'
          import sys
          import tomllib
          import zipfile
          from pathlib import Path

          declared = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          data = declared["tool"]["setuptools"]["package-data"]["teachers_teammate"]
          wanted = {f"teachers_teammate/{name}" for name in data}
          built = next(Path(sys.argv[1]).glob("*.whl"))
          missing = wanted - set(zipfile.ZipFile(built).namelist())
          if not wanted or missing:
              sys.exit(f"{built.name} does not carry: {sorted(missing)}")
          print(f"{built.name} carries the {len(wanted)} declared assets")
          PY
