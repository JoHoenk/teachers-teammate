version: 2

# Every entry below carries `cooldown: default-days: 7`: a version update is proposed only
# once the release is a week old. The build installs by version (the lock's hashes are
# dropped by make_constraints.py), so a malicious release of any of the ~90 packages the
# bundle carries would be merged before anyone noticed it. Such releases are usually found
# and pulled within days, so a week of waiting is what makes the difference. Security
# updates are never delayed — Dependabot exempts them from the cooldown.

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      # Each new version of these needs a sources release of its own before a tag (see NOTICE),
      # so a batch that carries one waits for that step instead of the weekly group.
      sources-release:
        applies-to: version-updates
        patterns: ["pyside6-essentials", "shiboken6", "opencv-python-headless"]
      pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Held back by packages that cap them (checked in the lock files, which pip-compile
    # resolves together): spacy needs thinc<8.4 and srsly<3, langsmith needs uuid-utils<1.
    # Drop an entry once the capping package allows the new major version.
    ignore:
      - dependency-name: "thinc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "srsly"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uuid-utils"
        update-types: ["version-update:semver-major"]

  # The standalone build's own pins: PyInstaller and the platform-only packages the
  # Linux lock cannot hold. A bump here is not covered by the Bazel tests (they run on
  # Linux), so the bundle test build (`.github/workflows/build_bundles.yml`) is its check.
  - package-ecosystem: "pip"
    directory: "/tools/build"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      build-pins:
        patterns: ["*"]

  # The Bazel modules in MODULE.bazel and the Bazel version in .bazelversion.
  # Two pins stay manual: the `trlc` git_override (a commit, not a release) and the
  # PlantUML artifact of the Maven install.
  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      bazel:
        patterns: ["*"]
    # Bazel 9 is a decision of its own, not a bump: every rule has to support
    # Bazel 8 first, so a proposal that needs 9 is closed rather than merged.
    ignore:
      - dependency-name: "bazel"
        versions: [">=9"]

  # The linters for the workflows themselves (actionlint, zizmor), pinned in tools/ci/.
  - package-ecosystem: "pip"
    directory: "/tools/ci"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      ci-lint:
        patterns: ["*"]

  # Every action is pinned by commit SHA with its version in a trailing comment (`# v7`), which
  # Dependabot keeps in step. `directories` adds the composite action that has one: a `uses:` inside it is
  # not found by the "/" entry.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-bazel"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
