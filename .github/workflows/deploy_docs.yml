# Deploys the Sphinx documentation to GitHub Pages. Runs on every push to main and can be
# triggered manually. The pull-request build is part of pull_request_checks.yml (the merge gate),
# so it is not repeated here.

name: Deploy Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: the deploy job needs pages + id-token; everything else reads.
permissions:
  contents: read

# Allow one concurrent Pages deployment; let an in-flight deploy finish rather
# than cancelling it (cancelling a deploy can leave Pages in a broken state).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_docs.yml
    with:
      upload: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
