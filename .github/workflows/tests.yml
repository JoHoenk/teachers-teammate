name: Reusable Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        with:
          disk-cache: tests

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 libglib2.0-0

      - name: Run unit tests
        # LangChain is an optional runtime dependency (pip install "teachers-teammate[llm]").
        # The test lock file (requirements_test_lock.txt) includes langchain-core so that
        # correction, evaluation, and LLM OCR tests are exercised in CI.
        run: bazel test --config=ci //tests/... --test_output=errors
        env:
          QT_QPA_PLATFORM: offscreen
