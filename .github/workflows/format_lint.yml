name: Reusable Format and Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: lint
          repository-cache: true

      - name: Allow unprivileged user namespaces (Bazel linux-sandbox)
        # Ubuntu 24.04 runners block them via AppArmor, which makes Bazel fall
        # back to the weaker processwrapper-sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check formatting
        run: bazel run --config=ci //:format.check

      - name: Run Python linters
        run: bazel test --config=ci //:lint --test_output=errors
