name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── Quality gate ─────────────────────────────────────────────────────────
  # The merge queue keeps `main` green, but a release is dispatched manually and
  # may target any ref/tag — and it publishes artifacts publicly, so we re-run
  # lint + tests here as a hard gate before anything is created.
  lint:
    uses: ./.github/workflows/format_lint.yml

  test:
    uses: ./.github/workflows/tests.yml

  # ── Create the GitHub Release (empty shell, build jobs attach assets) ────
  create-release:
    name: Create GitHub Release
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A draft, so a half-uploaded release is never visible: publish-release flips it once
      # every asset is attached.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.version }}
          # A draft's tag is only created when it is published; without this it would be put on
          # whatever the default branch is at that moment instead of the commit that was built.
          target_commitish: ${{ github.sha }}
          name: "Release ${{ inputs.version }}"
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(inputs.version, '-') }}
          make_latest: ${{ !contains(inputs.version, '-') }}

  # ── Wheel (pure-Python, platform-independent) ───────────────────────────
  build-wheel:
    needs: [create-release]
    permissions:
      contents: write
    uses: ./.github/workflows/build_wheel.yml
    with:
      version: ${{ inputs.version }}
      skip_artifact_upload: true
      publish_release_assets: true
      release_tag: ${{ inputs.version }}

  # ── Standalone executables + platform installers ─────────────────────────
  build-standalone:
    needs: [create-release]
    permissions:
      contents: write
    uses: ./.github/workflows/build_artifacts.yml
    with:
      version: ${{ inputs.version }}
      skip_artifact_upload: true
      publish_release_assets: true
      release_tag: ${{ inputs.version }}

  # ── Publish ───────────────────────────────────────────────────────────────
  # The last job, so the release only becomes visible once the wheel and every
  # platform installer are attached to it.
  publish-release:
    name: Publish the release
    needs: [build-wheel, build-standalone]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Flip the draft to a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
          else
            gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
          fi
