version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Held back by packages that cap them (checked in the lock files, which pip-compile
    # resolves together): spacy needs thinc<8.4 and srsly<3, langsmith needs uuid-utils<1.
    # Drop an entry once the capping package allows the new major version.
    ignore:
      - dependency-name: "thinc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "srsly"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uuid-utils"
        update-types: ["version-update:semver-major"]

  # The standalone build's own pins: PyInstaller and the platform-only packages the
  # Linux lock cannot hold. A bump here is not covered by the Bazel tests (they run on
  # Linux), so the smoke test of the next release dry run is its check.
  - package-ecosystem: "pip"
    directory: "/tools/build"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      build-pins:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
