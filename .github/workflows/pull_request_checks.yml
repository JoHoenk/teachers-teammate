# Quality gate for pull requests. Runs format-lint, the test suite, the docs build and CodeQL on
# every PR and on pushes to main.
#
# `main` requires the `check` job below (`PR merge gate`) with up-to-date branches, so a PR's run
# tested what lands.
#
# Not on tags: release.yml runs lint and tests itself, and a second run per tag only repeats it.
#
# The bundle build (build_bundles.yml) is not part of the gate on purpose: it runs only for the
# paths that can break it, and a required check that a path filter skips stays "pending" forever.
# Making it blocking would mean running three platform builds on every pull request.

name: Pull Request Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]

# Cancel superseded runs for the same PR; never cancel push runs.
concurrency:
  group: pull_request_checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/format_lint.yml

  test:
    uses: ./.github/workflows/tests.yml

  docs:
    uses: ./.github/workflows/build_docs.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read

  # Single required status check for branch protection on `main`. It stays green
  # only if every upstream job succeeds, so the protection rule never needs
  # updating when jobs are added or renamed.
  check:
    name: PR merge gate
    if: always()
    needs: [lint, test, docs, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          results="${RESULTS}"
          echo "Upstream job results: ${results}"
          for result in ${results}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job did not succeed (got '${result}')."
              exit 1
            fi
          done
          echo "All required jobs passed."
