name: Add-on resolution

# Weekly, and on dispatch: the newest langchain-openai, spaCy, ... are held against the
# versions the bundle ships, on each build runner natively. A red run is the signal, so release
# day is not the first time a new release of an add-on's package meets the bundle.
#
# The add-ons' packages are not in the test lock on purpose, so nothing else checks them. The
# constraints are the build environment's own freeze (tools/build/addon_constraints.py), not
# pyinstaller-work/constraints.txt: the latter is the whole test lock and pins langchain-core
# and spacy, so the run would never see a new release of the very packages it exists for.
#
# No --platform and no marker emulation: pip's markers see the real system here, which is what
# check_pins.py has to work around for its cross-platform checks.
#
# The same run keeps the add-on lock honest: the lock is what the installed app gives to pip, so
# every add-on is resolved twice, against the newest releases and against the lock (a pin that
# conflicts with the bundle, or has no wheel on one system, is red here instead of in a teacher's
# Add-ons window).  The licenses need no weekly run against PyPI: the lock pins the versions, so
# the offline inventory test covers them.  What does need one is the platform side: the lock is
# resolved on Linux, so a dependency that only exists on Windows or macOS is checked here, by
# holding what pip would install on this runner against the license inventory.

on:
  schedule:
    # Monday, 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the add-ons (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three runners the bundles are built on, so a conflict shows on the system whose
        # bundle it would break.
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version

      # The same venv steps as the bundle build (one composite action, so the two cannot
      # drift). No PyInstaller run: the check only needs the packages the bundle ships.
      - name: Create the build environment
        uses: ./.github/actions/build-venv

      - name: Write the bundle's constraints
        run: python tools/build/addon_constraints.py

      - name: Write the add-on lock
        run: python tools/build/addon_lock.py

      - name: Check that the add-ons resolve against the bundle
        shell: bash
        run: |
          python tools/build/check_addon_resolution.py \
            --python python \
            --constraints teachers_teammate/_build/addon_constraints.txt \
            --lock teachers_teammate/_build/addon_lock.txt \
            --report addon-reports

      # The add-on lock is resolved on Linux, so a dependency that only exists on Windows or
      # macOS never appears in it.  This holds what pip would install here against the license
      # inventory, which is where such a package has to be listed (or accepted) to ship.
      - name: Check the resolved add-ons against the license inventory
        shell: bash
        run: python tools/licenses/inventory.py --check-resolved addon-reports
