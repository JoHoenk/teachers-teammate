# Qt's third-party attributions, taken from Qt 6.12.0's own `qt_attribution.json` files, plus the
# LGPL-3.0 / GPL-2.0 / GPL-3.0 texts and Qt's GPL exception.  No wheel carries them — they live in
# Qt's sources — so this folder is hand-owned.  `shiboken6` is listed with `pyside6-essentials`
# because it is the other half of pyside-setup and its wheel carries no license file at all.
# A Qt minor bump adds or removes components, which is why the stamp names the minor version.
rows = ["pyside6-essentials", "shiboken6"]
valid_for = "6.12"
