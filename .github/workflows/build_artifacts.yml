name: Reusable Build Artifacts

on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: "Prefix for uploaded artifact names"
        required: false
        type: string
        default: "teachers-teammate"
      retention_days:
        description: "Retention days for uploaded artifacts"
        required: false
        type: number
        default: 14
      version:
        description: "Optional version used for installer file names (e.g. v1.2.3 or 1.2.3)"
        required: false
        type: string
        default: ""
      publish_release_assets:
        description: "Publish installers to a GitHub Release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish against when publish_release_assets is true"
        required: false
        type: string
        default: ""
      skip_artifact_upload:
        description: "Skip uploading build outputs to the artifact store"
        required: false
        type: boolean
        default: false
      platforms:
        description: 'JSON array of platforms to build (subset of ["linux","windows","macos"])'
        required: false
        type: string
        default: '["linux","windows","macos"]'

jobs:
  build-package:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # `artifact` is filtered by the `platforms` input; the `include`
        # entries below only attach the runner OS to the matching combination.
        artifact: ${{ fromJSON(inputs.platforms) }}
        include:
          # glibc 2.35: Ubuntu 22.04+, Debian 12+, Mint 21+. Building on a newer image
          # silently raises that floor, which check_linux_bundle.py then catches.
          # If GitHub drops the 22.04 image, run the build in an ubuntu:22.04 container
          # on ubuntu-latest instead of moving to a newer runner.
          - artifact: linux
            os: ubuntu-22.04
          - artifact: windows
            os: windows-latest
          - artifact: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          RAW="${{ inputs.version }}"
          CLEAN="${RAW#v}"
          # Strip pre-release suffix for Windows installer (VIProductVersion requires X.Y.Z.W)
          WIN="${CLEAN%%-*}"
          echo "value=${CLEAN}" >> "$GITHUB_OUTPUT"
          echo "win=${WIN}" >> "$GITHUB_OUTPUT"

      # Stamp the release version into the source tree so the bundled
      # __version__ (shown in the About dialog) matches the release tag.
      # Without this the standalone build ships the hardcoded dev version.
      - name: Stamp release version into source
        if: inputs.version != ''
        shell: bash
        run: python tools/release/stamp_versions.py --version "${{ inputs.version }}"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # Qt's xcb platform plugin links these; make_deb.sh measures the .deb's Depends: line
          # from what the bundle needs, which only works when they are installed here.
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libegl1 libgl1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Install Python dependencies
        shell: bash
        run: |
          # Base runtime deps only — optional providers (langchain/spacy)
          # are downloaded at runtime by the in-app addon manager, so they are
          # intentionally not bundled into the standalone binary.
          #
          # Every version comes from requirements_test_lock.txt (plus the
          # platform-only pins in tools/build/requirements_platform.txt), and
          # check_pins.py fails the build if pip installed anything else.
          python tools/build/make_constraints.py
          python -m pip install --upgrade -c pyinstaller-work/constraints.txt pip
          python -m pip install -c pyinstaller-work/constraints.txt \
            -e . pyinstaller pyinstaller-hooks-contrib
          python tools/build/check_pins.py
          # pip's markers hide Windows-only and macOS-only dependencies of PyInstaller from a
          # Linux resolver, so check them here, once, instead of on the runner that needs them.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python tools/build/check_pins.py --platform win_amd64
            python tools/build/check_pins.py --platform macosx_14_0_arm64
          fi
          # The license store must describe this environment, platform-only
          # packages included — that is why this runs on all three OS jobs.
          python tools/release/check_inventory.py --env

      - name: Build standalone binaries
        run: python tools/build/build_standalone.py
        env:
          QT_API: pyside6

      - name: Smoke-test the binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen ./dist/teachers-teammate/teachers-teammate --_smoke_test smoke.json

      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/teachers-teammate/teachers-teammate.exe `
            -ArgumentList '--_smoke_test', 'smoke.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "the smoke test exited with $($process.ExitCode)"
          }

      - name: Smoke-test the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./dist/teachers-teammate.app/Contents/MacOS/teachers-teammate --_smoke_test smoke.json

      - name: Upload the smoke test result
        if: ${{ always() && !inputs.skip_artifact_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.artifact }}-smoke
          retention-days: ${{ inputs.retention_days }}
          path: smoke.json

      - name: Check the Linux bundle
        if: runner.os == 'Linux'
        run: |
          python tools/build/check_linux_bundle.py --max-glibc 2.35
          python tools/build/check_linux_bundle.py --unused

      - name: Create .deb package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            bash tools/packaging/make_deb.sh "${{ steps.version.outputs.value }}"
          else
            bash tools/packaging/make_deb.sh
          fi

      # apt resolves Depends, so a library missing from the control file fails here rather
      # than on a user's machine. The smoke test then proves the app starts, and ldd on the
      # real-display plugin proves it has every library it links against.
      - name: Install the .deb in clean containers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "==> $image"
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends /dist/teachers-teammate_*_amd64.deb
              QT_QPA_PLATFORM=offscreen teachers-teammate --_smoke_test /tmp/out.json
              cat /tmp/out.json
              if ldd /opt/teachers-teammate/_internal/PySide6/Qt/plugins/platforms/libqxcb.so \
                  | grep "not found"; then
                echo "the xcb platform plugin is missing libraries" >&2
                exit 1
              fi
            '
          done

      - name: Create the portable tarball (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.value }}"
          if [[ -z "$VER" ]]; then VER="0.1.0"; fi
          bash tools/packaging/make_tarball.sh "$VER"

      - name: Install NSIS and create installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # Chocolatey does not update the current process PATH — prepend NSIS manually
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          $ver    = "${{ steps.version.outputs.value }}"
          $winVer = "${{ steps.version.outputs.win }}"
          if ([string]::IsNullOrEmpty($ver))    { $ver    = "0.1.0" }
          if ([string]::IsNullOrEmpty($winVer)) { $winVer = "0.1.0" }
          makensis /DAPP_VERSION="$ver" "/DAPP_VERSION_WIN=$winVer.0" tools/packaging/windows.nsi

      # The runner is elevated, so the per-user runs inside the script pass /SCOPE=user.
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Step 9 of the test downloads the shipped v0.5.6 installer with `gh`, which refuses
          # to run in Actions without a token.
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          if ([string]::IsNullOrEmpty($ver)) { $ver = "0.1.0" }
          $setup = Get-ChildItem dist -Filter 'teachers-teammate-*-w64-setup.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw "no installer in dist/" }
          pwsh -File tools/packaging/test_windows_installer.ps1 -Setup $setup.FullName -Version $ver

      - name: Create .dmg installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            bash tools/packaging/make_dmg.sh "${{ steps.version.outputs.value }}"
          else
            bash tools/packaging/make_dmg.sh
          fi

      # Platform-specific uploads prevent the macOS onedir intermediate
      # (dist/teachers-teammate/) from being swept up alongside the .dmg.
      - name: Upload build artifact (Linux)
        if: ${{ runner.os == 'Linux' && !inputs.skip_artifact_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.artifact }}
          retention-days: ${{ inputs.retention_days }}
          path: |
            dist/teachers-teammate-*-linux-x86_64.tar.gz
            dist/teachers-teammate_*.deb

      - name: Upload build artifact (Windows)
        if: ${{ runner.os == 'Windows' && !inputs.skip_artifact_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.artifact }}
          retention-days: ${{ inputs.retention_days }}
          path: dist/teachers-teammate-*-w64-setup.exe

      - name: Upload build artifact (macOS)
        if: ${{ runner.os == 'macOS' && !inputs.skip_artifact_upload }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.artifact }}
          retention-days: ${{ inputs.retention_days }}
          path: dist/teachers-teammate-*-macos.dmg

      - name: Publish GitHub Release assets
        if: inputs.publish_release_assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.release_tag }}
          # The release is a draft until publish-release flips it. Without this the action
          # publishes an existing draft after its first upload, and the release would be
          # visible while the other platforms are still building.
          draft: true
          files: |
            dist/teachers-teammate-*-linux-x86_64.tar.gz
            dist/teachers-teammate_*.deb
            dist/teachers-teammate-*-w64-setup.exe
            dist/teachers-teammate-*-macos.dmg
